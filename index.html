<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"></head><body><title>Line Watch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: dark rail on the left, light control-room workspace on the right. Production lines drawn as tile-flow strips. */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#121C26; --muted:#5B6A78; --line:#D8DEE4;
  --accent:#1B4FD6; --accent-ink:#FFFFFF; --accent-soft:#E3EAFB;
  --ok:#17935B; --ok-soft:#DDF3E8; --warn:#C27800; --warn-soft:#FBEBCB; --crit:#D1352B; --crit-soft:#FADDD9; --idle:#8896A3; --idle-soft:#E6EAEE;
  --plan:#8EA3D6; --c1:#1B4FD6; --c2:#C27800; --c3:#17935B; --c4:#8A4FD6; --rail:#0E1822; --rail-ink:#C9D4DE; --rail-dim:#7D8D9B; --rail-active:#1C2B39; --shadow:0 1px 2px rgba(15,25,35,.06),0 6px 20px rgba(15,25,35,.06);
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif; --f-body:'IBM Plex Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B131A; --surface:#121D27; --surface-2:#182531; --ink:#E7EDF2; --muted:#93A3B1; --line:#25343F;
  --accent:#6C93FF; --accent-ink:#07142E; --accent-soft:#1B2B4F;
  --ok:#3CC384; --ok-soft:#14352A; --warn:#F0AE3A; --warn-soft:#3A2D12; --crit:#F2685D; --crit-soft:#411D1B; --idle:#7F8E9B; --idle-soft:#202D38;
  --plan:#4A5F92; --c1:#6C93FF; --c2:#F0AE3A; --c3:#3CC384; --c4:#B28CFF; --rail:#070E14; --rail-active:#15222D; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B131A; --surface:#121D27; --surface-2:#182531; --ink:#E7EDF2; --muted:#93A3B1; --line:#25343F;
  --accent:#6C93FF; --accent-ink:#07142E; --accent-soft:#1B2B4F;
  --ok:#3CC384; --ok-soft:#14352A; --warn:#F0AE3A; --warn-soft:#3A2D12; --crit:#F2685D; --crit-soft:#411D1B; --idle:#7F8E9B; --idle-soft:#202D38;
  --plan:#4A5F92; --c1:#6C93FF; --c2:#F0AE3A; --c3:#3CC384; --c4:#B28CFF; --rail:#070E14; --rail-active:#15222D; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);padding:20px 12px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;align-self:start}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand svg{flex:none}
.brand b{font:700 24px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:#fff;display:block}
.brand span{font-size:11px;color:var(--rail-dim);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--rail-ink);cursor:pointer;font-weight:500}
.nav button:hover{background:var(--rail-active)}
.nav button[aria-current="page"]{background:var(--rail-active);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav button:focus-visible{outline:2px solid #8FB0FF}
.nav svg{width:18px;height:18px;flex:none;opacity:.85}
.nav .badge{margin-left:auto;font:500 11px var(--f-mono);padding:1px 7px;border-radius:99px;background:#2A3B4A;color:#E8EEF3}
.nav .badge.hot{background:var(--crit);color:#fff}
.rail-foot{margin-top:auto;font-size:12px;color:var(--rail-dim);padding:0 8px;display:flex;flex-direction:column;gap:8px}
.rail-foot button{all:unset;cursor:pointer;color:var(--rail-ink);text-decoration:underline;text-underline-offset:3px;font-size:12px}

.main{padding:22px max(20px,env(safe-area-inset-right,0px)) 60px 28px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:34px;line-height:1;text-transform:uppercase}
.top p{margin:6px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500;display:inline-flex;align-items:center;gap:7px;min-height:36px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 10px;min-height:28px;font-size:12.5px;border-radius:6px}
.btn svg{width:16px;height:16px}
.btn.ghost{background:transparent}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 16px 0}
.card-h h2{font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.card-h small{color:var(--muted)}
.card-b{padding:14px 16px 16px}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(168px,1fr));margin-bottom:14px}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));margin-top:14px}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));margin-top:14px}

.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
.kpi .v{font:600 38px/1.05 var(--f-display);display:flex;align-items:baseline;gap:6px}
.kpi .v small{font:500 14px var(--f-body);color:var(--muted)}
.kpi .d{font-size:12.5px;color:var(--muted)}
.kpi.bad .v{color:var(--crit)} .kpi.good .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)}
.up{color:var(--crit)} .down{color:var(--ok)}

.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--idle-soft);color:var(--muted)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.info{background:var(--accent-soft);color:var(--accent)}
.chip.plain::before{display:none}

/* production line strips */
.line{padding:14px 16px 16px;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0}
.line-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.line-h h3{font-size:19px;text-transform:uppercase}
.line-h .code{font:500 11px var(--f-mono);background:var(--ink);color:var(--surface);padding:2px 6px;border-radius:4px}
.line-h .meta{margin-left:auto;display:flex;gap:16px;color:var(--muted);font-size:12.5px}
.line-h .meta b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.flow{display:flex;gap:0;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.mach{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:136px;padding:9px 10px 10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);position:relative;display:flex;flex-direction:column;gap:3px;margin-right:22px}
.mach:last-child{margin-right:0}
.mach::after{content:"";position:absolute;right:-23px;top:50%;width:22px;height:2px;background:var(--line)}
.mach:last-child::after{display:none}
.mach:hover{border-color:var(--muted)}
.mach:focus-visible{outline:2px solid var(--accent)}
.mach .c{font:500 10.5px var(--f-mono);color:var(--muted)}
.mach .n{font-weight:600;font-size:13px;line-height:1.2;min-height:32px}
.mach .s{font-size:11.5px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.mach .s i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.mach.st-bd{background:var(--crit-soft);border-color:var(--crit)} .mach.st-bd .s{color:var(--crit)} .mach.st-bd .s i{background:var(--crit);animation:pulse 1.4s infinite}
.mach.st-mt{background:var(--warn-soft);border-color:var(--warn)} .mach.st-mt .s{color:var(--warn)} .mach.st-mt .s i{background:var(--warn)}
.mach.st-id .s i,.mach.st-dc .s i{background:var(--idle)}
.mach.st-ok .s{color:var(--ok)}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.mach.st-bd .s i{animation:none}}

/* bars */
.hb{display:grid;grid-template-columns:minmax(0,150px) 1fr auto;gap:4px 10px;align-items:center;font-size:13px}
.hb .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .trk{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.hb .fill{height:100%;background:var(--crit);border-radius:4px}
.hb .fill.pl{background:var(--plan)}
.hb .val{font:500 12px var(--f-mono);color:var(--muted);text-align:right;min-width:56px}
.hb-list{display:flex;flex-direction:column;gap:9px}
.hb-row{display:grid;grid-template-columns:minmax(0,150px) 1fr 64px;gap:10px;align-items:center;font-size:13px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .tick-x{fill:var(--muted)}
.chart .b-un{fill:var(--crit)} .chart .b-pl{fill:var(--plan)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* lists / tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th{text-align:left;font:500 11px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.tot td{font-weight:600;background:var(--surface-2)}
tr.dim td{color:var(--muted)}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--surface-2)}
td .sub{color:var(--muted);font-size:12px}
td.r,th.r{text-align:right}
.name{font-weight:600}
.stack{display:flex;flex-direction:column;gap:2px}
.row-list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0;padding-bottom:0}
.item:first-child{padding-top:0}
.item .grow{flex:1;min-width:0}
.item .grow .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .grow .s{color:var(--muted);font-size:12.5px}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:500}
.link:hover{text-decoration:underline}
.empty{color:var(--muted);padding:18px 0;text-align:center}

.gauge{position:relative;height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);min-width:90px}
.gauge .f{position:absolute;inset:0 auto 0 0;border-radius:3px}
.gauge .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.gauge.lg{height:12px}

.filters>div{min-width:0;max-width:100%}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters input,.filters select,.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:36px;min-width:0}
.filters input[type=search]{flex:1;min-width:180px;max-width:360px}
.seg{max-width:100%;overflow-x:auto;display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:7px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.alert{display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--crit-soft);border:1px solid var(--crit);margin-bottom:10px;flex-wrap:wrap}
.alert .grow{flex:1;min-width:220px}
.alert b{color:var(--crit)}
.timer{font:600 26px var(--f-display);color:var(--crit)}

/* kanban */
.kan{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:200px}
.col>h3{font-size:16px;text-transform:uppercase;display:flex;justify-content:space-between;padding:2px 4px;letter-spacing:.04em}
.col>h3 span{font:500 12px var(--f-mono);color:var(--muted)}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:6px}
.rc .t{font-weight:600}
.rc .m{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}

/* drawer + modal */
.layer{position:fixed;inset:0;z-index:50;display:none}
.layer.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(8,14,20,.5)}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;box-shadow:-10px 0 40px rgba(0,0,0,.25);padding:0 0 40px}
.drawer-h{position:sticky;top:0;background:var(--surface);padding:18px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;z-index:2}
.drawer-h h2{font-size:26px;line-height:1.05}
.drawer-h .x{margin-left:auto}
.sec{padding:16px 20px 0}
.sec>h4{margin:0 0 8px;font:500 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.facts div span{display:block;font-size:11.5px;color:var(--muted)}
.facts div b{font-weight:500}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--surface);border-radius:14px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet h2{padding:18px 20px 4px;font-size:26px}
.sheet .body{padding:8px 20px 4px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sheet .foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px 18px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field textarea{min-height:64px;resize:vertical}
.field .hint{font-size:12px;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr 80px;gap:8px;margin-bottom:6px}
.err{grid-column:1/-1;color:var(--crit);font-size:13px;background:var(--crit-soft);padding:8px 10px;border-radius:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.note{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note .link{margin-left:auto}

.card-b select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:36px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.primary.dng{background:var(--crit);border-color:var(--crit);color:#fff}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px 10px}
.field .chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink);font-weight:400}
@media (max-width:900px){.btn .lbl{display:none}}
.locgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.locbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.locbar .n{min-width:110px}
.locbar .gauge{flex:1}
.code{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;font:12px/1.5 var(--f-mono);overflow:auto;white-space:pre;max-height:230px;margin:0}
.cfg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.steps{margin:0 0 12px;padding-left:20px;color:var(--muted)}
.steps li{margin-bottom:4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--idle);margin-right:8px}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--warn)} .dot.err{background:var(--crit)}
@media (max-width:900px){
  .cfg{grid-template-columns:1fr}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;gap:12px;padding:10px max(12px,env(safe-area-inset-left,0px));overflow-x:auto}
  .brand span,.rail-foot{display:none}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent)}
  .main{padding:18px max(16px,env(safe-area-inset-right,0px)) 50px max(16px,env(safe-area-inset-left,0px))}
  .top h1{font-size:30px}
  .sheet .body{grid-template-columns:1fr}
  .line-h .meta{margin-left:0;width:100%}
}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="14" height="14" rx="2.5" fill="#6C93FF"/><rect x="19" y="1" width="14" height="14" rx="2.5" fill="#2B3E52"/><rect x="1" y="19" width="14" height="14" rx="2.5" fill="#2B3E52"/><rect x="19" y="19" width="14" height="14" rx="2.5" fill="#D1352B"/></svg>
      <div><b>Line Watch</b><span>Spares &amp; downtime</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="rail-foot"><span id="saveState">Saved in this browser only</span><button data-act="resetData">Reset sample data</button></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="layer" id="drawerLayer"><div class="scrim" data-act="closeDrawer"></div><aside class="drawer" id="drawer" role="dialog" aria-modal="true"></aside></div>
<div class="layer" id="modalLayer"></div>
<div class="toast" id="toast" hidden></div>

<script>
window.addEventListener('error',function(ev){var m=document.getElementById('main');if(m&&!m.children.length)m.innerHTML='<div style="padding:24px;font:14px sans-serif;color:#b00"><b>Line Watch could not start.</b><br>'+String(ev.message).replace(/</g,'&lt;')+'</div>'});
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MIN=60000, DAY=86400000;
const NOW=()=>Date.now();
const lkr=n=>'LKR '+Math.round(n).toLocaleString('en-US');
const lkrK=n=>n>=1e6?'LKR '+(n/1e6).toFixed(2)+'M':n>=1e3?'LKR '+Math.round(n/1e3)+'K':'LKR '+Math.round(n);
const MONF=['January','February','March','April','May','June','July','August','September','October','November','December'];

const MAIN='main';
const locName=k=>k===MAIN?'Main stores':((lById(k)||{}).name||k);
const locShort=k=>k===MAIN?'Main':((lById(k)||{}).code||k);
const locKeys=()=>[MAIN].concat(S.lines.map(l=>l.id));
const locSel=sel=>locKeys().map(k=>`<option value="${k}"${k===sel?' selected':''}>${esc(locName(k))}</option>`).join('');
function stockTotal(p){return Object.keys(p.byLine||{}).reduce((a,k)=>a+(+p.byLine[k]||0),0)}
function ensureStock(){let ch=false;S.parts.forEach(p=>{if(!p.byLine){p.byLine={};p.byLine[MAIN]=p.stock||0;ch=true}
  Object.keys(p.byLine).forEach(k=>{if(k!==MAIN&&!lById(k)){p.byLine[MAIN]=(p.byLine[MAIN]||0)+p.byLine[k];delete p.byLine[k];ch=true}});
  const t=stockTotal(p);if(t!==p.stock){p.stock=t;ch=true}});return ch}
function addStock(p,loc,q){p.byLine[loc]=(p.byLine[loc]||0)+q;p.stock=stockTotal(p)}
function takeStock(p,q,pref){const order=[pref,MAIN].concat(S.lines.map(l=>l.id)).filter((k,i,a)=>k&&a.indexOf(k)===i),out=[];let left=q;
  order.forEach(k=>{if(left<=0)return;const have=p.byLine[k]||0,t=Math.min(have,left);if(t>0){p.byLine[k]=have-t;left-=t;out.push({loc:k,q:t})}});p.stock=stockTotal(p);return out}
const allocText=a=>a.map(x=>locShort(x.loc)+' '+x.q).join(', ');
const locLine=p=>locKeys().filter(k=>(p.byLine[k]||0)>0).map(k=>locShort(k)+' '+p.byLine[k]).join(' · ')||'none';
function renumberMachines(){
  const cnt={},nid=S.machines.map(m=>{const l=lById(m.line),c=(l?l.code:'XX').toUpperCase();cnt[m.line]=(cnt[m.line]||0)+1;return c+'-'+String(cnt[m.line]).padStart(2,'0')});
  const map={};S.machines.forEach((m,i)=>{if(m.id!==nid[i])map[m.id]=nid[i]});if(!Object.keys(map).length)return false;
  const R=id=>map[id]||id;
  S.events.forEach(e=>{e.machine=R(e.machine)});S.parts.forEach(p=>{p.compat=p.compat.map(R)});S.assets.forEach(a=>{if(a.machine)a.machine=R(a.machine)});S.txns.forEach(t=>{if(t.machine)t.machine=R(t.machine)});
  S.machines.forEach((m,i)=>{m.id=nid[i];m.code='MC-'+m.id});return true}
function moveMachine(id,dir){
  const m=mById(id);if(!m)return;const idx=S.machines.map((x,i)=>x.line===m.line?i:-1).filter(i=>i>=0),pos=idx.indexOf(S.machines.indexOf(m)),to=pos+dir;
  if(to<0||to>=idx.length)return;const a=idx[pos],b=idx[to],t=S.machines[a];S.machines[a]=S.machines[b];S.machines[b]=t;
  renumberMachines();commit();toast('Moved '+m.name+' '+(dir<0?'up':'down')+', now '+m.id)}

function snap(){const o=Object.assign({},S);delete o.rev;delete o.dirty;return JSON.stringify(o)}
lastSnap=snap();
function migrate(){const a=ensureStock(),b=renumberMachines();return a||b}
function restore(str,msg){const o=JSON.parse(str);o.rev=S.rev;o.dirty=true;S=o;migrate();lastSnap=snap();edits++;save();render();
  if(drawerFn){renderDrawer();if(!$('#drawer').innerHTML.trim())closeDrawer()}scheduleSync();toast(msg)}
function undo(){if(!undoStack.length){toast('Nothing to undo');return}const e=undoStack.pop();redoStack.push({s:snap(),l:e.l});restore(e.s,'Undid: '+e.l)}
function redo(){if(!redoStack.length){toast('Nothing to redo');return}const e=redoStack.pop();undoStack.push({s:snap(),l:e.l});restore(e.s,'Redid: '+e.l)}

function range(days,off=0,pred=()=>true){const to=NOW()-off*DAY,from=to-days*DAY;return S.events.filter(e=>{const s=evStart(e);return s>=from&&s<to&&pred(e)})}
const sum=a=>a.reduce((x,e)=>x+evMin(e),0);

/* ---------- layers ---------- */
let drawerFn=null;
function openDrawer(fn){drawerFn=fn;$('#drawerLayer').classList.add('open');renderDrawer();$('#drawer').scrollTop=0}
function renderDrawer(){if(drawerFn){const d=$('#drawer'),y=d.scrollTop;d.innerHTML=drawerFn();if(!d.innerHTML.trim()){closeDrawer();return}d.scrollTop=y}}
function closeDrawer(){drawerFn=null;$('#drawerLayer').classList.remove('open')}
let toastT;
function toast(m){if(pendingLabel&&undoStack.length)undoStack[undoStack.length-1].l=m;pendingLabel=false;const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function modal(title,body,onSubmit,opt={}){
  const L=$('#modalLayer');
  L.innerHTML=`<div class="scrim" data-act="closeModal"></div><form class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2><div class="body">${body}<div class="err" hidden></div></div><div class="foot"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn primary${opt.danger?' dng':''}" type="submit">${esc(opt.submit||'Save')}</button></div></form>`;
  L.classList.add('open');
  const f=$('form',L);
  f.addEventListener('submit',e=>{e.preventDefault();const res=onSubmit(new FormData(f));if(typeof res==='string'){const er=$('.err',f);er.textContent=res;er.hidden=false;return}if(res!==false)closeModal()});
  const first=$('input:not([type=hidden]),select',f);if(first)first.focus();
  return f;
}
function closeModal(){$('#modalLayer').classList.remove('open');$('#modalLayer').innerHTML=''}
const opts=(arr,sel)=>arr.map(a=>{const v=Array.isArray(a)?a[0]:a,l=Array.isArray(a)?a[1]:a;return `<option value="${esc(v)}"${v===sel?' selected':''}>${esc(l)}</option>`}).join('');
const machOpts=sel=>S.lines.map(l=>`<optgroup label="${esc(l.name)}">${opts(S.machines.filter(m=>m.line===l.id).map(m=>[m.id,m.id+' · '+m.name]),sel)}</optgroup>`).join('');
const partOpts=sel=>opts(S.parts.map(p=>[p.id,p.code+' · '+p.name+' ('+p.stock+' in stock)']),sel);
function partRows(){return `<div class="field full"><label>Spare parts used (optional, taken from this machine's line first, then main stores)</label><div id="prows"><div class="prow"><select name="pu_part"><option value="">Select part…</option>${partOpts()}</select><input type="number" name="pu_qty" min="1" value="1" aria-label="Quantity"></div></div><button type="button" class="btn sm ghost" data-act="addPartRow" style="align-self:flex-start">${ic('plus')} Add another part</button></div>`}
function readParts(fd){const ids=fd.getAll('pu_part'),q=fd.getAll('pu_qty');const out=[];ids.forEach((id,i)=>{if(id)out.push({partId:id,qty:Math.max(1,parseInt(q[i])||1)})});return out}
function applyParts(list,machine,ref,by,when){const warn=[],pref=(mById(machine)||{}).line;list.forEach(u=>{const p=pById(u.partId);if(p.stock<u.qty)warn.push(p.code);const al=takeStock(p,u.qty,pref);S.txns.push({id:newId('tx'),t:when,partId:p.id,type:'Issue to machine',qty:-u.qty,machine,ref,by,loc:allocText(al)})});return warn}

/* ---------- actions: downtime ---------- */
function logDowntime(mid,resolveId){
  const ev=resolveId?S.events.find(e=>e.id===resolveId):null;
  const body=ev?`
    <div class="field full"><label>Machine</label><input value="${esc(mById(ev.machine).id+' · '+mById(ev.machine).name)}" disabled></div>
    <div class="field"><label for="f_end">Back in production at</label><input id="f_end" type="datetime-local" name="end" value="${toLocalInput(NOW())}" required></div>
    <div class="field"><label for="f_tech">Technician</label><input id="f_tech" name="tech" value="${esc(ev.tech)}"></div>
    <div class="field full"><label for="f_desc">What was done</label><textarea id="f_desc" name="desc">${esc(ev.desc)}</textarea></div>${partRows()}`
  :`
    <div class="field full"><label for="f_m">Machine</label><select id="f_m" name="machine" required>${machOpts(mid)}</select></div>
    <div class="field"><label for="f_type">Type</label><select id="f_type" name="type" data-cause>${opts(['Unplanned','Planned'])}</select></div>
    <div class="field"><label for="f_cause">Cause</label><input id="f_cause" name="cause" list="causeList" value="${UNPLANNED[0]}" required><datalist id="causeList">${UNPLANNED.map(c=>`<option value="${c}">`).join('')}</datalist></div>
    <div class="field"><label for="f_start">Stopped at</label><input id="f_start" type="datetime-local" name="start" value="${toLocalInput(NOW()-30*MIN)}" required></div>
    <div class="field"><label for="f_state">Status</label><select id="f_state" name="state" data-state><option value="open">Still down</option><option value="done">Already back up</option></select></div>
    <div class="field" id="endWrap" hidden><label for="f_end">Back up at</label><input id="f_end" type="datetime-local" name="end" value="${toLocalInput(NOW())}"></div>
    <div class="field"><label for="f_tech">Technician</label><input id="f_tech" name="tech" placeholder="e.g. S. Fernando"></div>
    <div class="field full"><label for="f_desc">What happened</label><textarea id="f_desc" name="desc" placeholder="Symptoms, what was checked, what was changed"></textarea></div>
    <div class="field full"><label for="f_block">Waiting for a spare part?</label><select id="f_block" name="blocked"><option value="">No</option>${S.parts.map(p=>`<option value="${p.id}">${esc(p.code+' · '+p.name+' ('+p.stock+' in stock)')}</option>`).join('')}</select></div>${partRows()}`;
  const f=modal(ev?'Resolve downtime':'Log downtime',body,fd=>{
    const tech=(fd.get('tech')||'').trim(),desc=(fd.get('desc')||'').trim(),used=readParts(fd);
    const short=used.find(u=>pById(u.partId).stock<u.qty);if(short){const sp=pById(short.partId);return 'Only '+sp.stock+' × '+sp.code+' in stock. Receive stock first or lower the quantity.'}
    if(ev){const end=Date.parse(fd.get('end'));if(!(end>evStart(ev)))return 'Back-in-production time must be after the stop time.';if(end>NOW()+MIN)return 'Back-in-production time cannot be in the future.';
      ev.end=new Date(end).toISOString();ev.tech=tech;ev.desc=desc;ev.parts=(ev.parts||[]).concat(used);delete ev.blocked;
      const w=applyParts(used,ev.machine,ev.id,tech||'Maintenance',end);commit();toast('Resolved after '+fDur(evMin(ev))+(w.length?' · stock short for '+w.join(', '):''));return}
    const start=Date.parse(fd.get('start'));if(!start)return 'Enter when the machine stopped.';
    const done=fd.get('state')==='done';const end=done?Date.parse(fd.get('end')):null;
    if(done&&!(end>start))return 'Back-up time must be after the stop time.';if(done&&end>NOW()+MIN)return 'Back-up time cannot be in the future.';
    if(!done&&openEv(fd.get('machine')))return 'This machine already has an open downtime. Resolve it first.';
    if(start>NOW()+MIN)return 'Stop time cannot be in the future.';
    const e={id:newId('dt'),machine:fd.get('machine'),type:fd.get('type'),cause:fd.get('cause'),start:new Date(start).toISOString(),end:end?new Date(end).toISOString():null,desc,tech,parts:used};
    if(fd.get('blocked'))e.blocked=fd.get('blocked');
    S.events.push(e);
    const w=applyParts(used,e.machine,e.id,tech||'Maintenance',end||NOW());commit();toast(done?'Downtime logged':'Machine marked down');
  },{submit:ev?'Mark resolved':'Log downtime'});
  if(!ev){
    const type=$('[data-cause]',f),cause=$('#f_cause',f),st=$('[data-state]',f);
    type.addEventListener('change',()=>{const l=type.value==='Planned'?PLANNED:UNPLANNED;$('#causeList',f).innerHTML=l.map(c=>`<option value="${c}">`).join('');cause.value=l[0]});
    st.addEventListener('change',()=>{$('#endWrap',f).hidden=st.value!=='done'});
  }
}

/* ---------- actions: stock ---------- */
function stockModal(kind,pid){
  const p=pById(pid),have=k=>p.byLine[k]||0;
  if(kind==='issue')modal('Issue '+p.code+' to machine',`
    <div class="field full"><label>Part</label><input value="${esc(p.name)} · ${p.stock} in stock (${esc(locLine(p))})" disabled></div>
    <div class="field full"><label for="f_m">Machine</label><select id="f_m" name="machine">${machOpts(p.compat[0])}</select></div>
    <div class="field"><label for="f_q">Quantity</label><input id="f_q" type="number" name="qty" min="1" value="1" required></div>
    <div class="field"><label for="f_from">Take from</label><select id="f_from" name="from"><option value="auto">Automatic (machine's line first)</option>${locKeys().map(k=>`<option value="${k}">${esc(locName(k))} (${have(k)})</option>`).join('')}</select></div>
    <div class="field"><label for="f_by">Issued to</label><input id="f_by" name="by" placeholder="Technician"></div>
    <div class="field"><label for="f_r">Downtime / work order reference</label><select id="f_r" name="ref"><option value="">None</option>${openEvents().map(e=>`<option value="${e.id}">${esc(e.machine+' · open since '+fDT(evStart(e)))}</option>`).join('')}</select></div>`,fd=>{
      const q=parseInt(fd.get('qty'));if(!(q>0))return 'Enter a quantity.';const from=fd.get('from');
      if(from==='auto'){if(q>p.stock)return 'Only '+p.stock+' in stock.'}else if(q>have(from))return 'Only '+have(from)+' in '+locName(from)+'.';
      const al=from==='auto'?takeStock(p,q,(mById(fd.get('machine'))||{}).line):(p.byLine[from]-=q,p.stock=stockTotal(p),[{loc:from,q}]);
      S.txns.push({id:newId('tx'),t:NOW(),partId:p.id,type:'Issue to machine',qty:-q,machine:fd.get('machine'),ref:fd.get('ref')||'',by:fd.get('by')||'Stores',loc:allocText(al)});
      const ev=S.events.find(e=>e.id===fd.get('ref'));if(ev)(ev.parts=ev.parts||[]).push({partId:p.id,qty:q});
      commit();toast(q+' × '+p.code+' issued from '+allocText(al))},{submit:'Issue'});
  if(kind==='receive')modal('Receive '+p.code,`
    <div class="field full"><label>Part</label><input value="${esc(p.name)} · ${p.stock} in stock" disabled></div>
    <div class="field"><label for="f_q">Quantity received</label><input id="f_q" type="number" name="qty" min="1" value="1" required></div>
    <div class="field"><label for="f_into">Put into</label><select id="f_into" name="into">${locSel(MAIN)}</select></div>
    <div class="field full"><label for="f_ref">Reference (GRN / invoice)</label><input id="f_ref" name="ref"></div>`,fd=>{
      const q=parseInt(fd.get('qty'));if(!(q>0))return 'Enter a quantity.';const into=fd.get('into');addStock(p,into,q);
      S.txns.push({id:newId('tx'),t:NOW(),partId:p.id,type:'Purchase',qty:q,machine:'',ref:fd.get('ref')||'',by:'Stores',loc:locShort(into)});commit();toast(q+' × '+p.code+' received into '+locName(into))},{submit:'Receive'});
  if(kind==='transfer')modal('Move '+p.code+' between locations',`
    <div class="field full"><label>Part</label><input value="${esc(p.name)} · ${esc(locLine(p))}" disabled></div>
    <div class="field"><label for="f_a">From</label><select id="f_a" name="from">${locKeys().map(k=>`<option value="${k}"${have(k)>0&&k===locKeys().find(x=>have(x)>0)?' selected':''}>${esc(locName(k))} (${have(k)})</option>`).join('')}</select></div>
    <div class="field"><label for="f_b">To</label><select id="f_b" name="to">${locSel(S.lines.length?S.lines[0].id:MAIN)}</select></div>
    <div class="field"><label for="f_q">Quantity</label><input id="f_q" type="number" name="qty" min="1" value="1" required></div>`,fd=>{
      const q=parseInt(fd.get('qty')),from=fd.get('from'),to=fd.get('to');if(!(q>0))return 'Enter a quantity.';if(from===to)return 'Choose two different locations.';if(q>have(from))return 'Only '+have(from)+' in '+locName(from)+'.';
      p.byLine[from]-=q;addStock(p,to,q);S.txns.push({id:newId('tx'),t:NOW(),partId:p.id,type:'Transfer',qty:q,machine:'',ref:locShort(from)+' to '+locShort(to),by:'Stores'});commit();toast('Moved '+q+' × '+p.code+' from '+locName(from)+' to '+locName(to))},{submit:'Move'});
  if(kind==='adjust')modal('Adjust count for '+p.code,`
    <div class="field full"><label>Enter what is actually counted in each location</label></div>
    <div class="field full"><div class="locgrid">${locKeys().map(k=>`<div class="field"><label for="ls_${k}">${esc(locName(k))}</label><input id="ls_${k}" type="number" min="0" name="ls_${k}" value="${have(k)}"></div>`).join('')}</div></div>
    <div class="field full"><label for="f_n">Reason</label><input id="f_n" name="note" placeholder="Cycle count, damaged, found stock…"></div>`,fd=>{
      const cnt={};locKeys().forEach(k=>{cnt[k]=Math.max(0,parseInt(fd.get('ls_'+k))||0)});
      if(!locKeys().some(k=>cnt[k]!==have(k)))return 'The counts match the system. Nothing to adjust.';
      const before=p.stock;p.byLine=cnt;p.stock=stockTotal(p);const diff=p.stock-before;
      S.txns.push({id:newId('tx'),t:NOW(),partId:p.id,type:'Stock adjustment',qty:diff,machine:'',ref:fd.get('note')||'Count',by:'Stores'});commit();toast('Stock adjusted by '+(diff>0?'+':'')+diff)},{submit:'Save counts'});
}

/* ---------- add / edit / remove ---------- */

const machChecks=sel=>S.lines.map(l=>`<div style="grid-column:1/-1"><div style="font-size:12px;color:var(--muted);margin:2px 0 4px">${esc(l.name)}</div><div class="checks">${S.machines.filter(m=>m.line===l.id).map(m=>`<label class="chk"><input type="checkbox" name="compat" value="${esc(m.id)}"${sel.indexOf(m.id)>=0?' checked':''}> ${esc(m.id)}</label>`).join('')||'<span class="sub">No machines</span>'}</div></div>`).join('');

function kpi(l,v,sm,d,cls=''){return `<div class="card kpi ${cls}"><span class="l">${l}</span><span class="v num">${v}${sm?`<small>${sm}</small>`:''}</span><span class="d">${d||'&nbsp;'}</span></div>`}

/* ---------- period helpers ---------- */
const Y0=t=>new Date(new Date(t).getFullYear(),0,1).getTime();
const ovBounds=()=>boundsFor(ui.ovRange,ui.ovMonth,ui.ovYear);
function boundsFor(r,mo,yr){
  const now=NOW();let from,pf=null,pt=null,label,plabel='previous period';
  if(r==='ytd'){const d=new Date(now);from=Y0(now);pf=new Date(d.getFullYear()-1,0,1).getTime();pt=new Date(d.getFullYear()-1,d.getMonth(),d.getDate(),d.getHours(),d.getMinutes()).getTime();label='this year so far';plabel='same period last year'}
  else if(r==='tm'||r==='lm'||r==='month'||r==='year'){
    const d=new Date(now);let y=d.getFullYear(),m=d.getMonth(),whole=false;
    if(r==='lm'){m-=1}else if(r==='month'){y=+yr;m=+mo}else if(r==='year'){y=+yr;whole=true}
    if(whole){from=new Date(y,0,1).getTime();const to2=new Date(y+1,0,1).getTime();pf=new Date(y-1,0,1).getTime();pt=from;label='the year '+y;plabel=String(y-1);return {from,to:to2,pf,pt,label,plabel}}
    from=new Date(y,m,1).getTime();const to2=new Date(y,m+1,1).getTime(),pm=new Date(y,m-1,1);pf=pm.getTime();pt=from;
    if(r==='tm'){pt=pf+(now-from);label='this month, '+MONF[m]+' '+y;plabel='the same point last month'}
    else{label=MONF[((m%12)+12)%12]+' '+new Date(y,m,1).getFullYear();plabel=MONF[pm.getMonth()]}
    return {from,to:to2,pf,pt,label,plabel}}
  else if(r==='all'){const m=S.events.reduce((a,e)=>Math.min(a,evStart(e)),now);from=Math.min(m,now-30*DAY);label='all time'}
  else{const d=+r;from=now-d*DAY;pf=from-d*DAY;pt=from;label=d===365?'the last 12 months':'the last '+d+' days';plabel='the '+d+' days before'}
  return {from,to:now,pf,pt,label,plabel}}
const dataStart=()=>S.events.reduce((a,e)=>Math.min(a,evStart(e)),NOW());
const evIn=(from,to,pred)=>S.events.filter(e=>{const t=evStart(e);return t>=from&&t<to&&(!pred||pred(e))});
function availRange(lid,from,to){const ms=S.machines.filter(m=>(!lid||m.line===lid)&&m.status!=='Decommissioned').map(m=>m.id);if(!ms.length||from>=NOW())return null;to=Math.min(to,NOW());const days=Math.max(1/24,(to-from)/DAY);const un=sum(evIn(from,to,e=>e.type==='Unplanned'&&ms.includes(e.machine)));return Math.max(0,1-un/(ms.length*days*SCHED))}
const mttrOf=list=>{const c=list.filter(e=>e.type==='Unplanned'&&e.end);return c.length?sum(c)/c.length:0};
const pct=v=>v==null?'–':(v*100).toFixed(1)+'%';
const short=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'K':String(Math.round(n));
function niceMax(v){if(v<=0)return 1;const pw=Math.pow(10,Math.floor(Math.log10(v))),n=v/pw;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*pw}
function delta(cur,prev,plabel,lowerBetter=true){if(prev==null)return '&nbsp;';if(!prev&&!cur)return 'no change vs '+plabel;const diff=cur-prev,pc=prev?Math.round(diff/prev*100):100,bad=lowerBetter?diff>0:diff<0;return `<span class="${diff===0?'':bad?'up':'down'}">${diff>0?'▲':diff<0?'▼':'='} ${Math.abs(pc)}%</span> vs ${plabel}`}
function deltaPts(cur,prev,plabel){if(cur==null||prev==null)return '&nbsp;';const d=(cur-prev)*100;if(Math.abs(d)<0.05)return 'no change vs '+plabel;return `<span class="${d>0?'down':'up'}">${d>0?'▲':'▼'} ${Math.abs(d).toFixed(1)} pts</span> vs ${plabel}`}
function timeBins(from,to){
  const days=(to-from)/DAY,bins=[];
  if(days<=45){let t=new Date(from);t=new Date(t.getFullYear(),t.getMonth(),t.getDate()).getTime();for(;t<to;t+=DAY)bins.push({from:t,to:t+DAY,label:fDate(t)});return {bins,unit:'day'}}

function dtFiltered(){
  const B=boundsFor(ui.dtRange,ui.dtMonth,ui.dtYear),q=ui.dtQ.toLowerCase();
  return evIn(B.from,B.to,e=>(!ui.dtLine||(mById(e.machine)||{}).line===ui.dtLine)&&(!ui.dtType||e.type===ui.dtType)&&(!q||(e.machine+' '+(mById(e.machine)||{}).name+' '+e.cause+' '+e.desc+' '+e.tech).toLowerCase().includes(q))).sort((a,b)=>evStart(b)-evStart(a));
}
function dtResults(){
  const evs=dtFiltered(),un=evs.filter(e=>e.type==='Unplanned'),cl=un.filter(e=>e.end);
  const byCause={};evs.forEach(e=>byCause[e.cause]=(byCause[e.cause]||0)+evMin(e));
  const causes=Object.entries(byCause).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const byM={};un.forEach(e=>byM[e.machine]=(byM[e.machine]||0)+evMin(e));
  const ms=Object.entries(byM).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const spareHit=evs.filter(e=>e.parts&&e.parts.length).length;
  const lim=ui.dtLimit||60;const rows=evs.slice(0,lim).map(e=>{const m=mById(e.machine);const parts=(e.parts||[]).map(u=>{const p=pById(u.partId);return p?`${u.qty}× ${p.code}`:''}).join(', ');
    return `<tr><td><div class="mono">${fDT(evStart(e))}</div><div class="sub">${esc(e.tech||'')}</div></td><td><button class="link" data-act="openMachine" data-id="${esc(e.machine)}">${esc(e.machine)}</button><div class="sub">${esc(m?m.name:'')}</div></td><td>${statusBadge(e.type,e.type==='Planned'?'info':'crit')}</td><td><div>${esc(e.cause)}</div><div class="sub">${esc(e.desc||'')}</div></td><td class="r mono">${e.end?fDur(evMin(e)):statusBadge('Down '+fDur(evMin(e)),'crit')}</td><td class="mono">${esc(parts)||'<span class="sub">–</span>'}${e.blocked?`<div class="sub">Waiting: ${esc((pById(e.blocked)||{}).code||'')}</div>`:''}</td><td class="r" style="white-space:nowrap">${e.end?'':`<button class="btn sm primary" data-act="resolveDowntime" data-id="${e.id}">Resolve</button> `}<button class="btn sm ghost" data-act="editEvent" data-id="${e.id}">Edit</button> <button class="btn sm ghost danger" data-act="deleteEvent" data-id="${e.id}" aria-label="Delete event">Delete</button></td></tr>`}).join('');
  return `<div class="grid g-kpi">
    ${kpi('Stops',evs.length,'',un.length+' unplanned, '+(evs.length-un.length)+' planned')}
    ${kpi('Unplanned',fHrs(sum(un)),'h','')}
    ${kpi('Planned',fHrs(sum(evs.filter(e=>e.type==='Planned'))),'h','')}
    ${kpi('Mean time to repair',cl.length?fDur(sum(cl)/cl.length):'–','','closed unplanned stops')}
    ${kpi('Stops that used spares',spareHit,'',evs.length?Math.round(spareHit/evs.length*100)+'% of stops':'')}
  </div>
  <div class="grid g-2" style="margin-top:0;margin-bottom:14px">
    <div class="card"><div class="card-h"><h2>By cause</h2></div><div class="card-b">${hbars(causes.map(([k,v])=>({l:k,v,t:fDur(v),c:PLANNED.includes(k)?'var(--plan)':'var(--crit)'})),causes[0]?causes[0][1]:1)}</div></div>
    <div class="card"><div class="card-h"><h2>By machine</h2><small>unplanned</small></div><div class="card-b">${hbars(ms.map(([k,v])=>({l:k+' '+((mById(k)||{}).name||'').replace(/ [A-Z]\d?$/,''),v,t:fDur(v),click:k})),ms[0]?ms[0][1]:1)}</div></div>
  </div>
  <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Stopped</th><th>Machine</th><th>Type</th><th>Cause</th><th class="r">Duration</th><th>Spares</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="7"><div class="empty">No stops match these filters.</div></td></tr>'}</tbody></table></div></div>${evs.length>lim?`<div style="text-align:center;padding:14px"><button class="btn" data-act="moreEvents">Show more (${evs.length-lim} left)</button></div>`:''}`;
}
function vDowntime(){
  const od=openEvents().map(e=>{const m=mById(e.machine);return `<div class="alert"><div class="grow"><b>${esc(m.id)} ${esc(m.name)} is down.</b> ${esc(e.cause)}. ${esc(e.desc||'')}<div class="sub">Since ${fDT(evStart(e))}</div></div><span class="timer num">${fDur(evMin(e))}</span><button class="btn sm primary" data-act="resolveDowntime" data-id="${e.id}">Resolve</button></div>`}).join('');

function gauge(p,lg){const s=stock(p),mx=Math.max(p.max||0,p.reorder*1.4,p.stock,1);const col=`var(--${s.c==='crit'?'crit':s.c==='warn'?'warn':'ok'})`;
  return `<div class="gauge ${lg?'lg':''}" title="Min ${p.min}, reorder ${p.reorder}"><div class="f" style="width:${Math.min(100,p.stock/mx*100)}%;background:${col}"></div><div class="tick" style="left:${p.min/mx*100}%"></div><div class="tick" style="left:${p.reorder/mx*100}%;opacity:.3"></div></div>`}
function partsFiltered(){const q=ui.partQ.toLowerCase();return S.parts.filter(p=>(!ui.partCat||p.cat===ui.partCat)&&(!ui.partSt||stock(p).k===ui.partSt)&&(!q||(p.name+' '+p.code+' '+p.pn+' '+p.brand).toLowerCase().includes(q))).sort((a,b)=>stock(a).r-stock(b).r||a.name.localeCompare(b.name))}

const CFG_KEY='linewatch-cfg';
const CFG0={url:'',key:'',row:'main',auto:true,sheetsUrl:'',sheetsToken:''};
let cfg=(function(){try{return Object.assign({},CFG0,JSON.parse(localStorage.getItem(CFG_KEY)||'{}'))}catch(e){return Object.assign({},CFG0)}})();
if(!cfg.sheetsToken)cfg.sheetsToken=Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6);
function saveCfg(){try{localStorage.setItem(CFG_KEY,JSON.stringify(cfg))}catch(e){}}
const sbOn=()=>!!(cfg.url&&cfg.key);
let sync={state:'off',msg:'',conflict:false},edits=0,pushing=false,pt=null;
const hhmm=()=>{const d=new Date();return p2(d.getHours())+':'+p2(d.getMinutes())};
function updateStatus(){const el=$('#saveState');if(!el)return;
  el.innerHTML=sbOn()?'<span class="dot '+(sync.state==='ok'?'ok':sync.state==='busy'||sync.state==='pending'?'busy':sync.state==='err'?'err':'')+'"></span>'+esc(sync.msg||'Cloud connected'):(memOnly?'Not saved (browser storage blocked)':'Saved in this browser only')}
function setSync(state,msg){sync.state=state;sync.msg=msg;updateStatus();if(ui.view==='settings'&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))){const b=$('#syncBadge');if(b)b.innerHTML=syncBadge()}}
function syncBadge(){return '<span class="dot '+(sync.state==='ok'?'ok':sync.state==='busy'||sync.state==='pending'?'busy':sync.state==='err'?'err':'')+'"></span>'+esc(sbOn()?(sync.msg||'Connected'):'Not connected')}
function explain(e){const m=String(e&&e.message||e);
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'Cannot reach Supabase. Check the project URL, or open the app from GitHub Pages (the Claude preview blocks outside connections).';
  if(/HTTP 401|HTTP 403|Invalid API key|JWT/i.test(m))return 'Supabase rejected the key. Use the anon public key.';
  if(/HTTP 404|PGRST205|does not exist/i.test(m))return 'Table not found. Run the SQL setup in Supabase first.';
  return m.slice(0,160)}
async function sb(path,o){o=o||{};const base=cfg.url.replace(/\/+$/,'').replace(/\/rest\/v1$/,'');
  const r=await fetch(base+'/rest/v1/'+path,{method:o.method||'GET',headers:Object.assign({apikey:cfg.key,Authorization:'Bearer '+cfg.key,'Content-Type':'application/json'},o.headers||{}),body:o.body?JSON.stringify(o.body):undefined});
  const tx=await r.text();if(!r.ok)throw new Error('HTTP '+r.status+' '+tx.slice(0,200));return tx?JSON.parse(tx):null}
async function pullCloud(){const rows=await sb('linewatch_state?id=eq.'+encodeURIComponent(cfg.row)+'&select=rev,data,updated_at');return rows&&rows.length?rows[0]:null}
function adopt(c){S=c.data;S.rev=c.rev;S.dirty=false;sync.conflict=false;migrate();undoStack=[];redoStack=[];lastSnap=snap();save();render()}
function scheduleSync(){if(!sbOn()||!cfg.auto||sync.conflict)return;clearTimeout(pt);setSync('pending','Unsynced changes');pt=setTimeout(()=>doSync(false),1200)}
async function doSync(manual){
  if(!sbOn()||pushing)return;pushing=true;setSync('busy','Syncing…');const e0=edits;
  try{
    const c=await pullCloud(),rev=S.rev||0;
    if(!c){const doc=Object.assign({},S,{rev:1,dirty:false});await sb('linewatch_state',{method:'POST',headers:{Prefer:'return=minimal'},body:{id:cfg.row,rev:1,data:doc}});S.rev=1;S.dirty=edits!==e0;save()}
    else if(c.rev>rev||c.rev<rev){if(S.dirty||c.rev<rev){sync.conflict=true;setSync('err','Cloud differs from this browser');render();return}adopt(c)}
    else if(S.dirty||manual){const next=rev+1,doc=Object.assign({},S,{rev:next,dirty:false});
      const res=await sb('linewatch_state?id=eq.'+encodeURIComponent(cfg.row)+'&rev=eq.'+rev,{method:'PATCH',headers:{Prefer:'return=representation'},body:{rev:next,data:doc,updated_at:new Date().toISOString()}});
      if(!res||!res.length){sync.conflict=true;setSync('err','Cloud differs from this browser');render();return}
      S.rev=next;S.dirty=edits!==e0;save()}
    setSync('ok','Synced '+hhmm());
  }catch(err){setSync('err',explain(err))}
  finally{pushing=false;if(S.dirty&&sync.state==='ok')scheduleSync()}
}
async function resolveCloud(useCloud){
  try{const c=await pullCloud();
    if(useCloud){if(c)adopt(c);else{sync.conflict=false;S.dirty=true}toast('Loaded the cloud version')}
    else{S.rev=c?c.rev:0;S.dirty=true;sync.conflict=false;await doSync(true);toast('Cloud overwritten with this browser\'s data')}
    render()}catch(err){setSync('err',explain(err))}}

const SQL=`create table if not exists linewatch_state (
  id text primary key,
  rev integer not null default 1,
  data jsonb not null,
  updated_at timestamptz not null default now()
);
alter table linewatch_state enable row level security;
create policy "linewatch anon access" on linewatch_state
  for all to anon using (true) with check (true);`;
const script=()=>`const TOKEN = '${cfg.sheetsToken}';

function doPost(e) {
  var d = JSON.parse(e.postData.contents);
  if (d.token !== TOKEN) return ContentService.createTextOutput('forbidden');
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  Object.keys(d.sheets).forEach(function (name) {
    var rows = d.sheets[name];
    var sh = ss.getSheetByName(name) || ss.insertSheet(name);
    sh.clear();
    if (!rows.length) return;
    sh.getRange(1, 1, rows.length, rows[0].length).setValues(rows);
    sh.getRange(1, 1, 1, rows[0].length).setFontWeight('bold');
    sh.setFrozenRows(1);
  });
  return ContentService.createTextOutput('ok');
}`;

 openPart:b=>openDrawer(partDrawer(b.dataset.id)),
 logDowntime:b=>logDowntime(b.dataset.id),
 resolveDowntime:b=>logDowntime(null,b.dataset.id),
 deleteEvent:b=>{if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Confirm?';setTimeout(()=>{b.dataset.armed='';b.textContent='Delete'},3000);return}S.events=S.events.filter(e=>e.id!==b.dataset.id);commit();toast('Event deleted')},
 setF:b=>{ui[b.dataset.k]=b.dataset.v;if(b.dataset.k==='dtRange')ui.dtLimit=0;render()},
 stockIssue:b=>stockModal('issue',b.dataset.id),stockReceive:b=>stockModal('receive',b.dataset.id),stockAdjust:b=>stockModal('adjust',b.dataset.id),
 moveMachine:b=>moveMachine(b.dataset.id,+b.dataset.dir),stockTransfer:b=>stockModal('transfer',b.dataset.id),
 newPart:()=>partForm(),newMachine:b=>machineForm(null,b.dataset.id),newPO:b=>poForm(b.dataset.id),newRepair:b=>repairForm(b.dataset.id),
 undo,redo,newLine:()=>lineForm(),editLine:b=>lineForm(b.dataset.id),deleteLine:b=>deleteLine(b.dataset.id),editMachine:b=>machineForm(b.dataset.id),deleteMachine:b=>deleteMachine(b.dataset.id),
 editPart:b=>partForm(b.dataset.id),deletePart:b=>deletePart(b.dataset.id),newAsset:()=>assetForm(),editAsset:b=>assetForm(b.dataset.id),deleteAsset:b=>deleteAsset(b.dataset.id),
 editEvent:b=>editEvent(b.dataset.id),editPO:b=>poEdit(b.dataset.id),deletePO:b=>deletePO(b.dataset.id),editRepair:b=>repairEdit(b.dataset.id),deleteRepair:b=>deleteRepair(b.dataset.id),moreEvents:()=>{ui.dtLimit=(ui.dtLimit||60)+60;render()},
 poReceive:b=>poReceive(b.dataset.id),
 poAdvance:b=>{const o=S.pos.find(x=>x.id===b.dataset.id);o.status=PO_FLOW[PO_FLOW.indexOf(o.status)+1];commit();toast(o.id+' is now '+o.status)},
 repairAdvance:b=>repairAdvance(b.dataset.id),
 addPartRow:b=>{const w=$('#prows');const d=document.createElement('div');d.className='prow';d.innerHTML=`<select name="pu_part"><option value="">Select part…</option>${partOpts()}</select><input type="number" name="pu_qty" min="1" value="1" aria-label="Quantity">`;w.appendChild(d)},
 copySql:()=>copyText(SQL),copyScript:()=>copyText(script()),
 exportXlsx,exportCsv:()=>exportCsv($('#csvSel').value),
 sheetsSend:()=>{cfg.sheetsUrl=$('#c_sheets').value.trim();saveCfg();pushSheets()},
 syncNow:()=>{sync.conflict=false;doSync(true)},
 useCloud:()=>resolveCloud(true),overwriteCloud:()=>resolveCloud(false),
 cfgSave:()=>{cfg.url=$('#c_url').value.trim().replace(/\/+$/,'');cfg.key=$('#c_key').value.trim();cfg.row=($('#c_row').value.trim()||'main');cfg.auto=$('#c_auto').value==='1';cfg.sheetsUrl=$('#c_sheets').value.trim();saveCfg();sync.conflict=false;
   if(!/^https:\/\/.+/.test(cfg.url)||!cfg.key){toast('Enter the project URL and anon key');return}doSync(true);render()},
 cfgClear:()=>{cfg.url='';cfg.key='';saveCfg();sync={state:'off',msg:'',conflict:false};updateStatus();render();toast('Disconnected. Data stays in this browser.')},
 clearDowntime:()=>{const evs=dtFiltered();if(!evs.length){toast('No downtime records in this view');return}const all=evs.length===S.events.length;confirmBox('Delete '+evs.length+' downtime record'+(evs.length>1?'s':'')+'?','This removes '+(all?'<b>all</b> downtime records':'the '+evs.length+' records shown (current period and filters)')+'. Spare-part stock is not changed. You can undo this straight afterwards.','Delete '+evs.length,()=>{const ids=new Set(evs.map(e=>e.id));S.events=S.events.filter(e=>!ids.has(e.id));S.txns.forEach(t=>{if(ids.has(t.ref))t.ref=''});S.repairs.forEach(r=>{if(ids.has(r.event))r.event=''});commit();toast('Deleted '+evs.length+' downtime records')})},
 resetData:b=>{if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Click again to reset';setTimeout(()=>{b.dataset.armed='';b.textContent='Reset sample data'},3000);return}const rv=S.rev;S=seed();S.rev=rv;closeDrawer();commit();toast('Sample data restored')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.tagName==='TR'&&e.target.closest('button,a,select'))return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b)}});
document.addEventListener('keydown',e=>{const tg=e.target.tagName;if((e.ctrlKey||e.metaKey)&&!/INPUT|TEXTAREA|SELECT/.test(tg)){const k=e.key.toLowerCase();if(k==='z'&&!e.shiftKey){e.preventDefault();undo();return}if((k==='z'&&e.shiftKey)||k==='y'){e.preventDefault();redo();return}}
  if(e.key==='Escape'){if($('#modalLayer').classList.contains('open'))closeModal();else if(drawerFn)closeDrawer()}
  if((e.key==='Enter'||e.key===' ')&&e.target.tagName==='TR'&&e.target.dataset.act){e.preventDefault();ACT[e.target.dataset.act](e.target)}});
function onFilter(e){const t=e.target;if(t.dataset.f){ui[t.dataset.f]=t.value;const pm=/^(ov|dt)(Month|Year)$/.exec(t.dataset.f);if(pm){ui[pm[1]+'Range']=ui[pm[1]+'Month']==='all'?'year':'month';if(pm[1]==='dt')ui.dtLimit=0;render();return}const r=$('#results');if(r){r.innerHTML=({downtime:dtResults,parts:partsResults,assets:assetsResults})[ui.view]()}else render()}
  if(t.dataset.mstatus){const m=mById(t.dataset.mstatus);m.status=t.value;commit();toast(m.id+' set to '+t.value)}}
document.addEventListener('input',e=>{if(e.target.type==='search')onFilter(e)});
document.addEventListener('change',e=>{if(e.target.type==='search')return;onFilter(e)});
setInterval(()=>{if(openEvents().length&&!$('#modalLayer').classList.contains('open')&&ui.view!=='settings'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='SELECT')render()},60000);

const h=(location.hash||'').slice(1);if(VIEWS[h])ui.view=h;
if(migrate()){S.dirty=true;lastSnap=snap();save()}
render();
updateStatus();
if(sbOn())doSync(false);
})();
</script>
</body></html>
